name: publish

# npm packages: publish when package.json versions change on main.
# Git tags (v*) are reserved for the app/site — not used here.

on:
  push:
    branches: [main]
    paths:
      - "packages/core/package.json"
      - "packages/pdfjs-text/package.json"
      - "packages/pdfdiff/package.json"
      - ".github/workflows/publish.yml"
      - "tools/publish-changed.mjs"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm ≥11.5.1 required for trusted publishing (OIDC)
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports OIDC
        run: npm install -g "npm@>=11.5.1" && npm -v

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm test

      - name: Publish new package versions (OIDC)
        run: node tools/publish-changed.mjs
