name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm accuracy:check
      - run: pnpm test:dist
      - run: |
          pnpm --filter @pdfdiff/cli pack --pack-destination packages/pdfdiff
          contents=$(tar -tzf packages/pdfdiff/pdfdiff-cli-*.tgz)
          echo "$contents" | grep -qx 'package/dist/cli.js'
          echo "$contents" | grep -qx 'package/llms.txt'
          echo "$contents" | grep -qx 'package/report.schema.json'
          rm -f packages/pdfdiff/pdfdiff-cli-*.tgz
